<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Asisten Internal NUSAwear</title>
  <style>
    :root {
      --bg: #f5f6f8; --surface: #ffffff; --text: #1d2330; --muted: #6b7280;
      --brand: #1f4e78; --brand-soft: #e8f0f8; --border: #e2e5ea; --danger: #b42318;
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218; --surface: #181d26; --text: #e6e9ef; --muted: #98a2b3;
        --brand: #4f8cc9; --brand-soft: #1d2b3d; --border: #283042; --danger: #f97066;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      background: var(--surface); border-bottom: 1px solid var(--border);
      padding: 14px 20px;
    }
    .brand { display: flex; align-items: center; gap: 12px; max-width: 760px; margin: 0 auto; }
    .logo {
      width: 40px; height: 40px; border-radius: 10px; background: var(--brand);
      color: #fff; display: grid; place-items: center; font-weight: 700;
    }
    header h1 { font-size: 1.05rem; margin: 0; }
    header p { margin: 2px 0 0; font-size: 0.82rem; color: var(--muted); }

    main { flex: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 20px 16px 0; display: flex; flex-direction: column; }
    .chat { flex: 1; display: flex; flex-direction: column; gap: 14px; padding-bottom: 16px; }

    .msg { display: flex; flex-direction: column; max-width: 85%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }
    .bubble {
      padding: 11px 14px; border-radius: var(--radius); line-height: 1.55;
      white-space: pre-wrap; word-wrap: break-word; font-size: 0.95rem;
    }
    .user .bubble { background: var(--brand); color: #fff; border-bottom-right-radius: 4px; }
    .bot .bubble { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .bot .bubble.error { color: var(--danger); }

    details { margin-top: 6px; font-size: 0.85rem; color: var(--muted); width: 100%; }
    summary { cursor: pointer; padding: 4px 2px; user-select: none; }
    .source {
      background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; margin: 6px 0; font-size: 0.85rem; color: var(--text);
    }
    .source strong { display: block; margin-bottom: 4px; color: var(--brand); font-size: 0.8rem; }

    .typing { display: inline-flex; gap: 4px; padding: 14px; }
    .typing span {
      width: 7px; height: 7px; border-radius: 50%; background: var(--muted);
      animation: blink 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }

    .suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
    .chip {
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      padding: 7px 12px; border-radius: 999px; font-size: 0.85rem; cursor: pointer;
    }
    .chip:hover { border-color: var(--brand); color: var(--brand); }

    .composer {
      position: sticky; bottom: 0; background: var(--bg);
      display: flex; gap: 10px; padding: 12px 0 16px;
    }
    .composer input {
      flex: 1; padding: 12px 14px; font-size: 1rem; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
    }
    .composer input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
    .composer button {
      padding: 0 20px; border: none; border-radius: 10px; background: var(--brand);
      color: #fff; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    .composer button:disabled { opacity: 0.5; cursor: default; }

    footer { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 10px 16px 18px; }

    @media (max-width: 480px) {
      .msg { max-width: 94%; }
      .composer button { padding: 0 14px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">N</div>
      <div>
        <h1>Asisten Internal NUSAwear</h1>
        <p>Jawaban dari SOP, kebijakan cuti, SOP toko, dan panduan produk</p>
      </div>
    </div>
  </header>

  <main>
    <section id="chat" class="chat" aria-live="polite">
      <div class="msg bot">
        <div class="bubble">Halo! Tanyakan apa saja seputar cuti, onboarding, SOP toko, atau produk. Saya hanya menjawab dari dokumen yang tersedia dan menyebutkan sumbernya.</div>
      </div>
    </section>

    <div class="suggest" id="suggest">
      <button class="chip" type="button">Berapa hari cuti tahunan saya?</button>
      <button class="chip" type="button">Sakit 1 hari, harus bawa surat dokter?</button>
      <button class="chip" type="button">Nomor HR berapa?</button>
      <button class="chip" type="button">Klaim garansi kirim bukti ke mana?</button>
    </div>

    <form id="form" class="composer" autocomplete="off">
      <input id="q" placeholder="Tulis pertanyaan..." maxlength="300" required>
      <button id="send" type="submit">Kirim</button>
    </form>
  </main>

  <footer>Dokumen dalam aplikasi ini fiktif, dibuat untuk latihan.</footer>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("q");
    const sendBtn = document.getElementById("send");
    const suggest = document.getElementById("suggest");

    function scrollDown() {
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }

    function addUserMessage(text) {
      const wrap = document.createElement("div");
      wrap.className = "msg user";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
      scrollDown();
    }

    function addBotMessage(text, sources = [], isError = false) {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");
      bubble.textContent = text;
      wrap.appendChild(bubble);

      if (sources.length) {
        const details = document.createElement("details");
        const summary = document.createElement("summary");
        summary.textContent = `Sumber (${sources.length} potongan)`;
        details.appendChild(summary);
        for (const s of sources) {
          const box = document.createElement("div");
          box.className = "source";
          const title = document.createElement("strong");
          title.textContent = s.dokumen.replace(/^DOKUMEN \d+:\s*/, "");
          const body = document.createElement("span");
          body.textContent = s.teks.replace(/^\[.*?\]\s*/, "");
          box.append(title, body);
          details.appendChild(box);
        }
        wrap.appendChild(details);
      }
      chat.appendChild(wrap);
      scrollDown();
    }

    function addTyping() {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.id = "typing";
      const bubble = document.createElement("div");
      bubble.className = "bubble typing";
      bubble.innerHTML = "<span></span><span></span><span></span>";
      wrap.appendChild(bubble);
      chat.appendChild(wrap);
      scrollDown();
    }

    async function ask(question) {
      addUserMessage(question);
      input.value = "";
      suggest.style.display = "none";
      sendBtn.disabled = true;
      addTyping();

      try {
        const res = await fetch("/ask", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question }),
        });
        const data = await res.json().catch(() => ({}));
        document.getElementById("typing")?.remove();
        if (!res.ok) {
          addBotMessage(data.detail || "Terjadi kesalahan. Coba lagi.", [], true);
        } else {
          addBotMessage(data.answer, data.sources || []);
        }
      } catch (err) {
        document.getElementById("typing")?.remove();
        addBotMessage("Tidak dapat terhubung ke server. Periksa koneksi lalu coba lagi.", [], true);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const question = input.value.trim();
      if (question.length < 3) return;
      ask(question);
    });

    suggest.addEventListener("click", (e) => {
      const chip = e.target.closest(".chip");
      if (chip) ask(chip.textContent);
    });
  </script>
</body>
</html>
